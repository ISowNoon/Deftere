const vs = {
		'epulaar':Inter([...c2,...v2], [...c1,...v1]),

function downloadNotes() {
			textarea = document.getElementById( "notes" );
      const text = textarea.value;
      const blob = new Blob([text], { type: "text/plain" });
      const url = URL.createObjectURL(blob);

      a.download = "notes.txt";
      a.click();

      URL.revokeObjectURL(url);
}

function AddToNotes(box){

		function Inter(X,Y){return X.map((x,i)=>{return[x, Y[i]];}); }



	function Pulaar(n,x){
		for (v of vs[n]){ x = x.replaceAll(v[0],v[1]) ; x = x.replaceAll(v[0].toLowerCase(),v[1].toLowerCase())}
		return x.replaceAll("\n","<br>");
	}
	function Convert(pulaar){
		text = Pulaar( pulaar , document.getElementById("notes").value );
		document.getElementById("output").innerHTML = text;
	}

function Dictionnaire_innitialize(){

document.getElementById('main').innerHTML = variables["dictionnaire"];

const submit = document.getElementById("submit");
const input = document.getElementById("input");
const suggestions = document.getElementById("page");
submit.addEventListener( "click", function(){ Submit(submit);});
input.addEventListener("keydown", function(e) {if (e.key === "Enter") {
	if (input.value){Submit(submit);}else{Search_history();}
}});

function Search_history(){
		suggestions.innerHTML = "";
		const history = variables["history"];
		if (!input.value){
	  suggestions.innerHTML = "";
    Object.keys(history).forEach(word => {
      const btn = document.createElement("button");
      btn.textContent = word;
      btn.style.color = "#08f";
      //btn.style.display = "block"; // each button on new line
      btn.id = "btn";
      btn.addEventListener( "click", function(){ find(btn);});
      suggestions.appendChild(btn);
	});
	}
}

input.addEventListener("input", () => {
suggestions.innerHTML = "";
const value = input.value.toLowerCase();
  if (value) {
    const filtered = variables["liste_of_words"].filter(word => word.startsWith(value)).slice(0,20);
    filtered.forEach(word => {
      const btn = document.createElement("button");
      btn.textContent = word;
      btn.style.display = "block"; // each button on new line
      btn.id = "btn";
      btn.addEventListener( "click", function(){ find(btn);});
      suggestions.appendChild(btn);
    });
  }else{Search_history();}
});
}
	


/**
font-family: Arial - Helvetica - Times New Roman - Georgia - Verdana - Courier New ...

function index( phr , word ){
	var n = 0;
	for ( p of phr ){
		if(p == word){return n + 1e+12;}
		n += 1;
	}
}

function search( query ){
	n = 0;
	var phrases = [[ index( [query], query ), query, n]];
	for ( phrase of liste ){
		n += 1 ;
		var phr = phrase.toLowerCase().split(' ');
		if( phr.includes( query )){
			phrases.push([ index( phr , query ), phrase.slice(0,-1), n]);
		}
	}

	return phrases.sort();
}

function Submit(b){
	b.innerHTML = document.getElementById("input").value;
	find( b );
	b.innerHTML = "submit";
}

function Add( condition ){
	if ( condition ){ return `` }
	return `class = "query"`;
}

function Split( paragraphe , query ){
		innerHTML = ``;
		for( word of paragraphe.split(' ') ){
			to_add = Add( word.toLowerCase() != query )
			innerHTML += `<button id = "btn" ${to_add} >${word}</button>`;
		}
		return innerHTML;
}

function paragraphes( phrases , query ){
	var paragraphes = `<button id = "back">...caggal</button><button id = "next">ieeso...</button>`

	for ( phrase of phrases ){
		paragraphes += `
		<details>
		<summary>${ Split( phrase[1] , query )}</summary>
		<button onclick="navigator.clipboard.writeText('${phrase[1]}')">copy phrase</button>
		<textarea  spellcheck="false" class 'nested' id = 'input-box' maxlength = '100' rows = '1' cols = '100' type = 'text' placeholder = "Xabc he pulaar / français ko Yabc / Zabc" ></textarea></details>`;
	}
	return paragraphes;
}

function fill( phrases , indexes , query ){
	const page = document.getElementById( "page" );
	display = phrases.slice( indexes , indexes+lines )
	page.innerHTML = paragraphes( display , query );
	b = document.getElementById("back");
	b.addEventListener( "click", function(){ prev_page( phrases , query );});
	b = document.getElementById("next");
	b.addEventListener( "click", function(){ next_page( phrases , query );});

	for ( b of document.querySelectorAll("#btn") ){
		b.addEventListener( "click", function(){ find(this);});
	}
	for ( i of document.querySelectorAll("#input-box") ){
		i.addEventListener("keydown", function(e) {if (e.key === "Enter") {e.preventDefault();AddToNotes(this);}});
	}
}


function find( button ){
	query = button.innerHTML.toLowerCase();
	const history = variables["history"]
	indexes = history[query];
	if (indexes === undefined ){indexes=0;}
	history[query] = indexes;
	document.getElementById( "input").value = query;
	phrases = search( query ); // ko dhooyenne
	fill( phrases , indexes , query );

}

function next_page( phrases , query ){
	const history = variables["history"];
	indexes = history[query] + lines;
	if ( indexes-lines >= phrases.length ){return false;}
	history[query] = indexes;
	fill( phrases , indexes , query );
}

function prev_page( phrases , query ){
	const history = variables["history"];
	indexes = history[query] - lines;
	if ( indexes+lines < 1 ){return false;}
	history[query] = indexes;
	fill( phrases , indexes , query );
}


function loadData(){
  const raw = localStorage.getItem('dictionnaire');
  if(!raw) return "";
  try { return raw; } catch(e){ return ""; }
}

function saveData(data){
	//localStorage.clear()
	localStorage.setItem('dictionnaire', data );
}
